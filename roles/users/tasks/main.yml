---
- name: Create application group
  ansible.builtin.group:
    name: "{{ app_user }}"
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'
