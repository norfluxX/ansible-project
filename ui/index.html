<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Commerce Platform</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb}.sidebar{min-height:100vh;background:#14213d}.sidebar a{color:#dbe5f5;text-decoration:none;padding:.8rem 1rem;display:block;border-radius:.5rem}.sidebar a.active,.sidebar a:hover{background:#0d6efd;color:#fff}.card{border:0;box-shadow:0 2px 12px rgba(20,33,61,.07)}.metric{font-size:1.8rem;font-weight:700}.service-dot{width:10px;height:10px;border-radius:50%;display:inline-block}@media(max-width:768px){.sidebar{min-height:auto}}</style></head>
<body><div class="container-fluid"><div class="row"><aside class="col-lg-2 col-md-3 sidebar p-3"><h5 class="text-white mb-4">🛒 E-Commerce</h5><nav><a data-page="dashboard" href="#dashboard">⌂ Dashboard</a><a data-page="products" href="#products">▣ Products</a><a data-page="users" href="#users">♟ Users</a><a data-page="orders" href="#orders">🛒 Orders</a><a data-page="monitoring" href="#monitoring">▥ Monitoring</a></nav></aside><main class="col-lg-10 col-md-9 p-4"><div id="alert" class="alert d-none"></div><div id="app"></div></main></div></div>
<div class="modal fade" id="formModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form id="entityForm"><div class="modal-header"><h5 class="modal-title" id="modalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="modalBody"></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>
const app=document.getElementById('app'),modal=new bootstrap.Modal('#formModal');let action='';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw Error(await r.text()||r.statusText);return r.json()}function msg(t,type='success'){const a=document.getElementById('alert');a.className='alert alert-'+type;a.textContent=t;setTimeout(()=>a.classList.add('d-none'),3000)}
async function dashboard(){app.innerHTML='<h2>Dashboard</h2><p class="text-muted">Live data from the FastAPI microservices.</p><div class="row g-3 mb-4" id="metrics"></div><div class="row g-3"><div class="col-xl-7"><div class="card p-3"><h5>Recent Orders</h5><table class="table" id="ordersTable"></table></div></div><div class="col-xl-5"><div class="card p-3"><h5>System Services</h5><div id="services"></div></div></div></div>';try{const[p,u,o]=await Promise.all([api('/products'),api('/users'),api('/orders')]);document.getElementById('metrics').innerHTML=[['Products',p.length,'primary'],['Users',u.length,'success'],['Orders',o.length,'info'],['API','OK','success']].map(x=>`<div class="col-xl-3 col-sm-6"><div class="card p-3"><small class="text-muted">${x[0]}</small><div class="metric">${x[1]}</div><span class="text-${x[2]}">Live</span></div></div>`).join('');document.getElementById('ordersTable').innerHTML='<thead><tr><th>Order ID</th><th>Status</th></tr></thead><tbody>'+o.slice(-8).reverse().map(x=>`<tr><td>${esc(x.order_id)}</td><td><span class="badge text-bg-success">${esc(x.status)}</span></td></tr>`).join('')+'</tbody>';document.getElementById('services').innerHTML=['Product Service','User Service','Order Service','MySQL','Redis','Nginx'].map(x=>`<p><span class="service-dot bg-success me-2"></span>${x}<span class="float-end text-success">Running</span></p>`).join('')}catch(e){msg(e.message,'danger')}}
async function products(){app.innerHTML='<div class="d-flex justify-content-between mb-4"><div><h2>Products</h2><p class="text-muted">Live MySQL data.</p></div><button class="btn btn-primary" onclick="productForm()">＋ Add Product</button></div><div class="card p-3"><table class="table" id="table"></table></div>';try{const r=await api('/products');document.getElementById('table').innerHTML='<thead><tr><th>ID</th><th>Name</th><th>Price</th></tr></thead><tbody>'+r.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>$${Number(x.price).toFixed(2)}</td></tr>`).join('')+'</tbody>'}catch(e){msg(e.message,'danger')}}
async function users(){app.innerHTML='<div class="d-flex justify-content-between mb-4"><div><h2>Users</h2><p class="text-muted">Live MySQL data.</p></div><button class="btn btn-success" onclick="userForm()">＋ Add User</button></div><div class="card p-3"><table class="table" id="table"></table></div>';try{const r=await api('/users');document.getElementById('table').innerHTML='<thead><tr><th>ID</th><th>Name</th><th>Email</th></tr></thead><tbody>'+r.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td></tr>`).join('')+'</tbody>'}catch(e){msg(e.message,'danger')}}
async function orders(){app.innerHTML='<div class="d-flex justify-content-between mb-4"><div><h2>Orders</h2><p class="text-muted">Live Redis data.</p></div><button class="btn btn-info text-white" onclick="orderForm()">＋ Create Order</button></div><div class="card p-3"><table class="table" id="table"></table></div>';try{const r=await api('/orders');document.getElementById('table').innerHTML='<thead><tr><th>Order ID</th><th>Status</th></tr></thead><tbody>'+r.reverse().map(x=>`<tr><td>${esc(x.order_id)}</td><td><span class="badge text-bg-success">${esc(x.status)}</span></td></tr>`).join('')+'</tbody>'}catch(e){msg(e.message,'danger')}}
function monitoring(){const h=location.hostname;app.innerHTML=`<h2>Monitoring</h2><p class="text-muted">Ansible-managed observability.</p><div class="row g-3"><div class="col-md-6"><div class="card p-4"><h5>Prometheus</h5><a class="btn btn-outline-primary" target="_blank" href="http://${h}:9090">Open Prometheus</a></div></div><div class="col-md-6"><div class="card p-4"><h5>Grafana</h5><a class="btn btn-outline-warning" target="_blank" href="http://${h}:3000">Open Grafana</a></div></div></div>`}
function form(title,html,a){action=a;document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;modal.show()}function productForm(){form('Add Product','<input name="name" class="form-control mb-3" placeholder="Product name" required><input name="price" class="form-control" type="number" step=".01" min="0" placeholder="Price" required>','product')}function userForm(){form('Add User','<input name="name" class="form-control mb-3" placeholder="Full name" required><input name="email" class="form-control" type="email" placeholder="Email" required>','user')}function orderForm(){form('Create Order','<input name="order_id" class="form-control" placeholder="ORD-1001" required>','order')}
document.getElementById('entityForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{if(action==='product')await api('/products',{method:'POST',body:JSON.stringify({name:d.name,price:+d.price})});else if(action==='user')await api('/users',{method:'POST',body:JSON.stringify(d)});else await api('/orders/'+encodeURIComponent(d.order_id),{method:'POST'});modal.hide();msg('Saved successfully');route()}catch(x){msg(x.message,'danger')}};function route(){const p=location.hash.slice(1)||'dashboard';document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===p));({dashboard,products,users,orders,monitoring}[p]||dashboard)()}addEventListener('hashchange',route);route();
</script></body></html>
