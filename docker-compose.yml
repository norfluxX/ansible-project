services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  product-service:
    build: ./services/product-service
    environment:
      SERVICE_NAME: product-service
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
    depends_on:
      mysql:
        condition: service_healthy
    expose: ["8000"]

  user-service:
    build: ./services/user-service
    environment:
      SERVICE_NAME: user-service
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
    depends_on:
      mysql:
        condition: service_healthy
    expose: ["8000"]

  order-service:
    build: ./services/order-service
    environment:
      SERVICE_NAME: order-service
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    expose: ["8000"]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ui:/usr/share/nginx/html:ro
    depends_on:
      - product-service
      - user-service
      - order-service

volumes:
  mysql_data:
