---
- name: Roll back application containers
  hosts: app
  become: true
  serial: 1
  vars:
    rollback_tag: "{{ previous_version | default('1.0.0') }}"
  tasks:
    - name: Stop current product container
      community.docker.docker_container:
        name: ecommerce-product
        state: stopped
      ignore_errors: true

    - name: Stop current user container
      community.docker.docker_container:
        name: ecommerce-user
        state: stopped
      ignore_errors: true

    - name: Stop current order container
      community.docker.docker_container:
        name: ecommerce-order
        state: stopped
      ignore_errors: true

    - name: Show rollback target
      ansible.builtin.debug:
        msg: "Rollback requested to {{ rollback_tag }} on {{ inventory_hostname }}"
