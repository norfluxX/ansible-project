---
- name: Rolling application deployment
  hosts: app
  become: true
  serial: 1
  vars:
    deployment_version: "1.0.0"
  tasks:
    - name: Show target version
      ansible.builtin.debug:
        msg: "Deploying {{ deployment_version }} to {{ inventory_hostname }}"
      tags: [always]

    - name: Pull latest service images
      community.docker.docker_image:
        name: "{{ item }}"
        source: pull
      loop:
        - "{{ service_images.product_service }}"
        - "{{ service_images.user_service }}"
        - "{{ service_images.order_service }}"
      register: image_pull
      changed_when: image_pull.results | selectattr('changed', 'equalto', true) | list | length > 0
      tags: [deploy]

    - name: Restart application stack
      community.docker.docker_compose_v2:
        project_src: "{{ app_root }}"
        state: present
      register: compose_result
      tags: [deploy]

    - name: Health check
      ansible.builtin.uri:
        url: "http://127.0.0.1:8000/health"
        status_code: 200
      register: health
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"
      until: health.status == 200
      tags: [verify]

    - name: Deployment failed safely
      ansible.builtin.debug:
        msg: "Rollback should be triggered for {{ inventory_hostname }}"
      when: health is failed
      tags: [verify]
